name: Import reviewed academic source
on:
  push:
    branches: [main]
    paths:
      - Alexandra-Mislin-Academic-Website-2026-10-31.zip
      - .github/workflows/import-reviewed-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'mislin11/alexandra-mislin-site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack reviewed source only
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile, os
          archive=Path('Alexandra-Mislin-Academic-Website-2026-10-31.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '1e3c8d6a458053b05825bb82ef7a3bc962b36b3321e57c88c061ed8d86f4078b'
          count=0
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for item in z.infolist():
                  rel=PurePosixPath(item.filename).relative_to('alexandra-mislin-site')
                  assert not rel.is_absolute() and '..' not in rel.parts
                  if rel.parts[0]=='dist':continue
                  assert not any(x in rel.parts for x in ('.git','.local-editor','__pycache__'))
                  target=Path(str(rel))
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
                  os.chmod(target,(item.external_attr >> 16) & 0o777 or 0o644)
                  count+=1
          assert count==75, count
          archive.unlink()
          Path('.github/workflows/import-reviewed-source.yml').unlink()
          print('Verified and restored',count,'reviewed source files')
          PY
      - name: Build and validate
        run: python3 tools/build.py && python3 tools/check.py
      - name: Commit reviewed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore complete reviewed academic website source'
          git push origin HEAD:main
